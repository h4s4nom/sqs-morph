<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQS Morph Products V2 Fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111}.page-section{max-width:1240px;margin:auto;padding:28px 20px 70px}.product-list-nav{display:flex;justify-content:center;gap:26px;margin:0 0 28px;font-size:14px}.product-list-layout-container{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.product-list-item{position:relative}.product-list-item-link{display:block;text-decoration:none;color:inherit}.product-list-item-image{position:relative}.grid-image-wrapper{position:relative;padding-bottom:125%;overflow:hidden;background:#f1f1ef}.grid-image-cover{position:absolute;inset:0}.grid-image-cover img{width:100%;height:100%;object-fit:cover;display:block}.product-list-item-meta{padding-top:12px}.product-list-title-price{display:flex;justify-content:space-between;gap:12px}.product-list-item-price{white-space:nowrap}.product-list-item-add-to-cart{margin-top:10px}.product-list-item-add-to-cart button{padding:10px 14px;border:1px solid #111;background:#111;color:#fff}.product-mark{position:absolute;top:12px;right:12px;background:#fff;padding:5px 8px;font-size:10px}@media(max-width:700px){.product-list-layout-container{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<section class="page-section product-list" data-sqsp-section="product-list" id="featured-products">
<nav class="product-list-nav"><b>All</b><span>Tops</span><span>Bottoms</span><span>Sale</span></nav>
<div class="product-list-layout-container" data-product-list-layout="grid">
<script>
const hues=['#d7c8bb','#b7b9b2','#c4b3a5','#ddd8cc','#aaa59f','#d1c5bd','#bbb5a8','#c7ccd0','#d6c8cf','#aab5c0','#d4c0ae','#c0c8bb','#bdb6c9','#c4c4c4','#d8cfc1','#b5c7d1'];
for(let i=1;i<=16;i++){
  const sale=i%5===0?'<span class="product-mark">Sale</span>':'';
  document.write(`<div class="product-list-item">${sale}<a class="product-list-item-link" href="#product-${i}"><div class="product-list-item-image"><div class="grid-image-wrapper"><div class="grid-image-cover"><img alt="Studio Product ${i}" src="${'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 750\"><rect width=\"600\" height=\"750\" fill=\"${hues[(i-1)%hues.length]}\"/><circle cx=\"300\" cy=\"310\" r=\"150\" fill=\"rgba(255,255,255,.35)\"/><text x=\"300\" y=\"345\" text-anchor=\"middle\" fill=\"%23222\" font-family=\"Arial\" font-size=\"48\">${String(i).padStart(2,'0')}</text></svg>`)}"></div></div></div><div class="product-list-item-meta"><div class="product-list-title-price"><div class="product-list-item-title">Studio Product ${i}</div><div class="product-list-item-price">$${40+i*4}.00</div></div></div></a><div class="product-list-item-add-to-cart"><button>Add to Cart</button></div></div>`)
}
</script>
</div></section>
<script id="sqs-morph" src="/app.js" data-token="sm_demo_product_v02" data-debug="true" async></script>
</body></html>
